[project]
name = "weld-defect-vision"
version = "0.1.0"
description = "Weld defect detection using YOLOv8 fine-tuning with FastAPI inference server"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.21",
    "black==26.5.1",
    "mypy==2.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
