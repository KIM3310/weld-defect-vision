name: Export ONNX

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Path to the .pt checkpoint (relative to repo root)
        required: true
        default: checkpoints/best.pt
  schedule:
    # Nightly regeneration at 02:30 UTC when a model is available
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_PATH: ${{ github.event.inputs.checkpoint || 'checkpoints/best.pt' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnx onnxruntime onnx-simplifier

      - name: Check checkpoint exists
        id: checkpoint
        run: |
          if [ -f "$CHECKPOINT_PATH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Checkpoint not found at $CHECKPOINT_PATH. This workflow expects a trained model to be committed or downloaded."
          echo "Scheduled runs will skip export; manual runs will fail."
          if [ "${{ github.event_name }}" = "schedule" ]; then
            exit 0
          fi
          exit 1

      - name: Skip export when no checkpoint is available
        if: github.event_name == 'schedule' && steps.checkpoint.outputs.exists != 'true'
        run: echo "Skipping scheduled ONNX export because $CHECKPOINT_PATH is missing."

      - name: Export ONNX
        if: steps.checkpoint.outputs.exists == 'true'
        run: |
          python serving/export_onnx.py \
            --checkpoint "$CHECKPOINT_PATH" \
            --output "artifacts/weld_defect.onnx"

      - name: Validate ONNX graph
        if: steps.checkpoint.outputs.exists == 'true'
        run: |
          python -c "
          import onnx
          model = onnx.load('artifacts/weld_defect.onnx')
          onnx.checker.check_model(model)
          print(f'ONNX model valid: {len(model.graph.node)} nodes')
          "

      - name: Smoke test inference
        if: steps.checkpoint.outputs.exists == 'true'
        run: |
          python -c "
          import numpy as np
          import onnxruntime as ort
          sess = ort.InferenceSession('artifacts/weld_defect.onnx')
          input_name = sess.get_inputs()[0].name
          dummy = np.random.randn(1, 3, 640, 640).astype(np.float32)
          out = sess.run(None, {input_name: dummy})
          print(f'Inference OK. Output shape: {[o.shape for o in out]}')
          "

      - name: Upload artifact
        if: steps.checkpoint.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weld-defect-onnx
          path: artifacts/
          retention-days: 30
