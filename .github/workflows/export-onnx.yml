name: Export ONNX

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Path to the .pt checkpoint (relative to repo root)
        required: true
        default: checkpoints/best.pt
      quantize:
        description: Apply INT8 quantization
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Nightly regeneration at 02:30 UTC when a model is available
    - cron: "30 2 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnx onnxruntime onnx-simplifier

      - name: Check checkpoint exists
        run: |
          if [ ! -f "${{ github.event.inputs.checkpoint || 'checkpoints/best.pt' }}" ]; then
            echo "Checkpoint not found. This workflow expects a trained model to be committed or downloaded."
            echo "Scheduled runs will silently skip; manual runs will fail."
            if [ "${{ github.event_name }}" = "schedule" ]; then
              exit 0
            else
              exit 1
            fi
          fi

      - name: Export ONNX
        run: |
          python serving/export_onnx.py \
            --checkpoint "${{ github.event.inputs.checkpoint || 'checkpoints/best.pt' }}" \
            --output "artifacts/weld_defect.onnx" \
            ${{ github.event.inputs.quantize == 'true' && '--quantize' || '' }}

      - name: Validate ONNX graph
        run: |
          python -c "
          import onnx
          model = onnx.load('artifacts/weld_defect.onnx')
          onnx.checker.check_model(model)
          print(f'ONNX model valid: {len(model.graph.node)} nodes')
          "

      - name: Smoke test inference
        run: |
          python -c "
          import numpy as np
          import onnxruntime as ort
          sess = ort.InferenceSession('artifacts/weld_defect.onnx')
          input_name = sess.get_inputs()[0].name
          dummy = np.random.randn(1, 3, 640, 640).astype(np.float32)
          out = sess.run(None, {input_name: dummy})
          print(f'Inference OK. Output shape: {[o.shape for o in out]}')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weld-defect-onnx
          path: artifacts/
          retention-days: 30
