name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Lint with ruff
        run: ruff check src/ api/ tests/ benchmarks/

      - name: Format check with black
        run: black --check src/ api/ tests/ benchmarks/

      - name: Type check with mypy
        run: mypy --ignore-missing-imports src/ api/
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=xml
        env:
          WELD_DEFECT_CI: "1"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: weld-defect-vision:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './edge'
          severity: warning
