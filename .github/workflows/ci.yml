name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Lint with ruff
        run: ruff check src/ api/ tests/ benchmarks/

      - name: Format check with black
        run: black --check src/ api/ tests/ benchmarks/

      - name: Type check with mypy
        run: mypy --ignore-missing-imports src/ api/
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=xml
        env:
          WELD_DEFECT_CI: "1"

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Docker-relevant changes
        id: docker_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "${base:-}" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" "${{ github.sha }}" | grep -E '^(Dockerfile|\\.dockerignore|api/|src/|edge/|requirements.*\\.txt|pyproject\\.toml|poetry\\.lock|uv\\.lock)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.docker_changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.docker_changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: weld-defect-vision:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker image build
        if: steps.docker_changes.outputs.build != 'true'
        run: echo "No Docker-relevant files changed; skipping image build."

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './edge'
          severity: warning
